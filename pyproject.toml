[project]
name = "ai-etl-agent"
version = "0.1.0"
description = "This is simple ETL Chat Agent"
readme = "README.md"
authors = [
    { name = "YajithVishwa", email = "yajithvishwa2001@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.3.15",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-pymupdf4llm>=1.28.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp[cli]>=2.0.0",
    "requests>=2.34.2",
    "snowflake-connector-python>=4.7.2",
]

[project.scripts]
ai-etl-agent = "ai_etl_agent:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
